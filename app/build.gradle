plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.easydialer'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.easydialer"
        minSdk 25
        targetSdk 33
        // Each CI build gets a higher number, so a newer APK can be installed over an older one.
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName "1.${System.getenv("GITHUB_RUN_NUMBER") ?: "0"}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildFeatures
    {
        dataBinding = true
    }

    // The permanent key comes from CI secrets (see .github/workflows/build.yml). Without it,
    // release builds are signed with the debug key, which changes on every CI machine.
    def releaseKeystore = System.getenv("EASYDIALER_KEYSTORE")
    def hasReleaseKey = releaseKeystore != null && file(releaseKeystore).exists()

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("EASYDIALER_KEYSTORE_PASSWORD")
                keyAlias System.getenv("EASYDIALER_KEY_ALIAS")
                keyPassword System.getenv("EASYDIALER_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        // Release: not debuggable, and optimised and shrunk by R8. Much faster on an old phone
        // than the debug build.
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }
}

apply plugin: 'kotlin-kapt'

dependencies {
    def room_version = "2.5.2"

    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation "androidx.room:room-common:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.6.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.1"

    implementation 'com.github.bumptech.glide:glide:4.12.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.6'

    kapt "androidx.room:room-compiler:$room_version"


    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}