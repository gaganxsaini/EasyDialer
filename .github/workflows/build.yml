name: Build APK

# Manual only: run it from the Actions tab (or `gh workflow run build.yml`) when a build is wanted.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # Kept on the run page too, so the APK isn't lost if publishing the release fails.
      - name: Save APK on the run page
        uses: actions/upload-artifact@v4
        with:
          name: EasyDialer-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release with the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk EasyDialer.apk
          # GitHub's API sometimes answers 500; try a few times before giving up.
          for attempt in 1 2 3; do
            gh release create "build-${{ github.run_number }}" EasyDialer.apk \
              --title "EasyDialer build ${{ github.run_number }}" \
              --notes "Debug build of ${{ github.sha }}. Download EasyDialer.apk on the phone and open it to install." \
              --target "${{ github.sha }}" && exit 0
            sleep 20
          done
          exit 1
