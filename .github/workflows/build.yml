name: Build APK

# Manual only: run it from the Actions tab (or `gh workflow run build.yml`) when a build is wanted.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional permanent signing key, so new builds install over old ones and keep her data.
      # Add these repository secrets to turn it on: EASYDIALER_KEYSTORE_BASE64 (the .jks file,
      # base64-encoded), EASYDIALER_KEYSTORE_PASSWORD, EASYDIALER_KEY_ALIAS, EASYDIALER_KEY_PASSWORD.
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.EASYDIALER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Strip spaces/line breaks a copy-paste may have added.
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "EASYDIALER_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the permanent key."
          else
            echo "::warning::No EASYDIALER_KEYSTORE_BASE64 secret; signing with a throwaway debug key (uninstall needed before installing)."
          fi

      - name: Build release APK
        env:
          EASYDIALER_KEYSTORE_PASSWORD: ${{ secrets.EASYDIALER_KEYSTORE_PASSWORD }}
          EASYDIALER_KEY_ALIAS: ${{ secrets.EASYDIALER_KEY_ALIAS }}
          EASYDIALER_KEY_PASSWORD: ${{ secrets.EASYDIALER_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      # Kept on the run page too, so the APK isn't lost if publishing the release fails.
      - name: Save APK on the run page
        uses: actions/upload-artifact@v4
        with:
          name: EasyDialer-apk
          path: app/build/outputs/apk/release/app-release.apk

      # A one-commit branch holding just the latest APK: fetchable with plain git when the
      # releases API is having trouble.
      - name: Put the APK on the apk branch
        run: |
          mkdir apk-branch && cd apk-branch
          cp ../app/build/outputs/apk/release/app-release.apk EasyDialer.apk
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EasyDialer.apk
          git commit -q -m "EasyDialer build ${{ github.run_number }} from ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk

      - name: Publish release with the APK
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk EasyDialer.apk
          # GitHub's API sometimes answers 500; try a few times before giving up.
          for attempt in 1 2 3; do
            gh release create "build-${{ github.run_number }}" EasyDialer.apk \
              --title "EasyDialer build ${{ github.run_number }}" \
              --notes "Build of ${{ github.sha }}. Download EasyDialer.apk on the phone and open it to install." \
              --target "${{ github.sha }}" && exit 0
            sleep 20
          done
          exit 1
